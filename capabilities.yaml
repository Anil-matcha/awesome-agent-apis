# Shared capability taxonomy for the catalog. Pick the closest existing capability
# when tagging a new endpoint; propose a new one in your PR description if nothing fits.
#
# `media.*` covers models/*.yaml (muapi's own hosted generative-media models, browsable
# here but auto-synced, not community-editable). Every other group below covers
# providers/*.yaml (community-submitted third-party tools).

media:
  - media.text_to_image
  - media.image_to_image
  - media.text_to_video
  - media.image_to_video
  - media.video_to_video
  - media.audio_to_video
  - media.text_to_audio
  - media.text_to_text
  - media.image_to_3d
  - media.text_to_3d
  - media.lora_training
  - media.training
  - media.other

seo:
  - seo.serp
  - seo.backlinks
  - seo.keyword_research
  - seo.rank_track
  - seo.domain_overview
  - seo.site_audit
  - seo.local_listings

people:
  - people.email_find
  - people.email_verify
  - people.enrich

company:
  - company.enrich
  - company.firmographics

social:
  - social.publish
  - social.analytics
  - social.trends

scraping:
  - scraping.web
  - scraping.social

ads:
  - ads.management
  - ads.creative
  - ads.measurement

market_data:
  - market_data.stocks
  - market_data.crypto
  - market_data.fx

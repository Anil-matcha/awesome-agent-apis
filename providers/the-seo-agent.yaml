provider: the-seo-agent
docs_url: https://www.theseoagent.ai/connect/mcp
status: draft

auth:
  location: header
  format: "Authorization: Bearer {key}"
  bad_key_behavior: >-
    A bad or missing key returns HTTP 401 with JSON:
    {"error":{"code":"unauthorized","message":"Missing or invalid API key. Pass it as `Authorization: Bearer sk_live_...`."},"request_id":"..."}.

pricing:
  model: flat_subscription
  amount: 99.0
  currency: USD
  free_tier: "none (starts with a US$1 3-day trial including 3 articles, then US$99/month for 30 articles)"
  source_url: https://www.theseoagent.ai/pricing
  checked: 2026-11-28
  note: "Self-serve API keys (sk_live_...) are generated in the dashboard; an open-source MIT MCP wrapper is also published at https://github.com/jeremy665/theseoagent-mcp."

endpoints:
  - id: the-seo-agent.list-projects
    method: GET
    path: /api/v1/projects
    summary: "List connected websites and project IDs accessible to the API key."
    params: []
    note: "Also serves as a lightweight key validation check."

  - id: the-seo-agent.run-audit
    method: POST
    path: /api/v1/agents/audit
    summary: "Start a technical SEO site audit and crawl job for a project."
    params:
      - name: project_id
        in: body
        type: string
        required: true
        example: "proj_123"
    note: "Returns an asynchronous job ID to poll at /api/v1/jobs/{id}."

  - id: the-seo-agent.keyword-research
    method: POST
    path: /api/v1/agents/keyword-research
    summary: "Discover and score commercial keywords for a project domain."
    params:
      - name: project_id
        in: body
        type: string
        required: true
        example: "proj_123"
    note: "Returns a job ID to poll at /api/v1/jobs/{id}."

  - id: the-seo-agent.generate-article
    method: POST
    path: /api/v1/agents/generate
    summary: "Queue a fact-checked, citation-verified SEO article draft for a queued keyword."
    params:
      - name: project_id
        in: body
        type: string
        required: true
        example: "proj_123"
    note: "Returns a job ID to poll at /api/v1/jobs/{id}."

  - id: the-seo-agent.publish-article
    method: POST
    path: /api/v1/agents/publish
    summary: "Publish a generated article to the project's connected CMS (WordPress, Webflow, Shopify, or webhook)."
    params:
      - name: article_id
        in: body
        type: string
        required: true
        example: "art_123"
    note: ""

  - id: the-seo-agent.list-articles
    method: GET
    path: /api/v1/articles
    summary: "List drafted and published SEO articles for the workspace."
    params: []
    note: ""

  - id: the-seo-agent.get-article
    method: GET
    path: /api/v1/articles/{id}
    summary: "Fetch full markdown content and metadata for one article."
    params:
      - name: id
        in: path
        type: string
        required: true
        example: "art_123"
    note: ""

  - id: the-seo-agent.get-job
    method: GET
    path: /api/v1/jobs/{id}
    summary: "Poll status and output for an asynchronous audit, keyword-research, or generation job."
    params:
      - name: id
        in: path
        type: string
        required: true
        example: "job_123"
    note: ""

base_url: https://www.theseoagent.ai

provider: restosignals
docs_url: https://restosignals.com/restoapi
status: draft

auth:
  location: header
  format: "X-API-Key: {key}"
  bad_key_behavior: >-
    A bad or missing key returns a real HTTP 401 with the JSON body
    {"detail": "Missing or invalid X-API-Key."} (tested 2026-10-18 on
    GET /v1/openings with a made-up key and with no header at all), so
    status-code checks work. `Authorization: Bearer {key}` is also accepted
    in place of the X-API-Key header (tested on GET /v1/account, 200).
  note: >-
    Self-serve keys: a free account key with no card at https://restosignals.com/signup,
    or an anonymous 15-credit trial key from `POST /v1/register` (no body, no auth;
    returns {"api_key": "...", "credits": 15}).

pricing:
  model: credits
  free_tier: "15-credit trial key from POST /v1/register, no signup or card. The tested /v1/openings call returning 1 venue cost 1 credit. Owner contact is locked on the free/trial plan (response shows contact.locked: true)."
  source_url: https://restosignals.com/pricing
  checked: 2026-10-18
  note: "Paid plans are listed on the pricing page; a subscription unlocks owner name and contact details."

endpoints:
  - id: restosignals.list-openings
    method: GET
    path: /v1/openings
    summary: "US restaurants and bars expected to open in the next 1-6 months, each a deduped venue fused from liquor-license, food-permit and new-business filings and scored by opening_score (0-100)."
    params:
      - name: state
        in: query
        type: string
        required: false
        example: "NY"
      - name: city
        in: query
        type: string
        required: false
        example: "New York"
      - name: min_opening_score
        in: query
        type: integer
        required: false
        example: 80
      - name: signal_type
        in: query
        type: string
        required: false
        example: "liquor"
      - name: since
        in: query
        type: string
        required: false
        example: "2026-10-01"
      - name: limit
        in: query
        type: integer
        required: false
        example: 1
      - name: offset
        in: query
        type: integer
        required: false
        example: 0
    note: "Response carries credits_used, credits_remaining and truncated_by_balance (results are cut when credits run out). Live states with hot leads: NY, TX, IL, CA, OR."

  - id: restosignals.latest-openings
    method: GET
    path: /v1/openings/latest
    summary: "Most recently surfaced openings."
    params:
      - name: state
        in: query
        type: string
        required: false
        example: "TX"
      - name: limit
        in: query
        type: integer
        required: false
        example: 10
    note: "Not exercised in the live test; shape taken from https://api.restosignals.com/openapi.json."

  - id: restosignals.list-signals
    method: GET
    path: /v1/signals
    summary: "The underlying filings (liquor license, food permit, new business) behind the scored venues."
    params:
      - name: state
        in: query
        type: string
        required: false
        example: "IL"
      - name: signal_type
        in: query
        type: string
        required: false
        example: "food_permit"
      - name: limit
        in: query
        type: integer
        required: false
        example: 10
    note: "Not exercised in the live test; shape taken from the OpenAPI spec."

  - id: restosignals.export
    method: GET
    path: /v1/export
    summary: "Same filters as /v1/openings, returned as a CSV file."
    params:
      - name: state
        in: query
        type: string
        required: false
        example: "CA"
    note: "Returns CSV, not JSON. Not exercised in the live test; shape taken from the OpenAPI spec."

  - id: restosignals.account
    method: GET
    path: /v1/account
    summary: "Validate the key and read the plan and remaining credit balance."
    params: []
    note: ""

base_url: https://api.restosignals.com

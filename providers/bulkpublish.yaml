provider: bulkpublish
docs_url: https://app.bulkpublish.com/docs
status: draft

auth:
  location: header
  format: "Authorization: Bearer {key}"
  bad_key_behavior: >-
    A bad or missing key returns a real HTTP 401 with a JSON body:
    {"error": {"message": "Unauthorized", "code": "UNAUTHORIZED"}}.
    Keys start with `bp_` and are created in the app under Settings > Developer.
    OAuth 2.1 (PKCE, scoped `bpat_` tokens) is also supported, in beta.
  note: "An OpenAPI 3.1 spec is published at https://app.bulkpublish.com/openapi.json. A hosted MCP server is at https://mcp.bulkpublish.com (API key as bearer token, or OAuth sign-in); docs at https://www.bulkpublish.com/integrations/mcp-server/ and toolkit at https://github.com/bulkpublish/bulkpublish-ai-toolkit."

pricing:
  model: flat_subscription
  amount: 13.99
  currency: USD
  free_tier: "Free plan: 3 channels (1 per platform), 1 post per day, no card required. API access is included on every plan with no separate API charge."
  source_url: https://www.bulkpublish.com/pricing/
  checked: 2026-11-04
  note: "Pro $13.99/mo (30 channels), Business $39.99/mo (75 channels). Extra channel slots $2.99/mo each. X posts draw on a monthly X allowance on paid plans, then pay-as-you-go credits."

endpoints:
  - id: bulkpublish.list-platforms
    method: GET
    path: /api/platforms
    summary: "List the 15 supported social platforms and whether each can currently be connected and published to."
    params: []
    note: ""

  - id: bulkpublish.list-channels
    method: GET
    path: /api/channels
    summary: "List the social accounts connected to the workspace, with token and reconnect status."
    params: []
    note: "Channel `id` values are what post-creation calls take as targets."

  - id: bulkpublish.create-post
    method: POST
    path: /api/posts
    summary: "Create a post for one or more connected channels, saved as a draft (default) or scheduled."
    params:
      - name: content
        in: body
        type: string
        required: false
        example: "Hello from the API"
      - name: channels
        in: body
        type: array
        required: true
        example: [{"channelId": 143}]
      - name: status
        in: body
        type: string
        required: false
        example: "draft"
    note: "`content` is optional when media is attached; `status` is draft (default) or scheduled. Not exercised in the live test, which used read-only calls only. See the OpenAPI spec for scheduling and per-platform options."

  - id: bulkpublish.quota-usage
    method: GET
    path: /api/quotas/usage
    summary: "Read the plan, its limits and current usage (channels, posts, API requests, storage)."
    params: []
    note: "Free to call; useful to validate a key. A limit of -1 means unlimited."

base_url: https://app.bulkpublish.com

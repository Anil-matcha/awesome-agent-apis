# Copy this file to providers/<provider>.yaml and fill it in.
# Every field marked REQUIRED must be present. Remove this comment block once done.

provider: example-provider          # REQUIRED — lowercase, hyphenated, matches the filename
docs_url: https://example.com/docs  # REQUIRED — provider's own API documentation
status: draft                       # REQUIRED — draft until a maintainer independently verifies

auth:
  location: header                  # REQUIRED — header | query | path
  format: "Authorization: Bearer {key}"   # REQUIRED — exact header/param name and shape
  bad_key_behavior: ""              # REQUIRED — what actually happens on a bad/missing key
                                     #   (status code AND body shape — some APIs return 200
                                     #   with an error message instead of 401/403)

pricing:
  model: per_call                   # per_call | credits | flat_subscription | free
  amount: 0.0
  currency: USD
  free_tier: ""                     # describe the free tier if one exists, else "none"
  source_url: https://example.com/pricing   # REQUIRED — where you confirmed the price
  checked: 2026-01-01                # REQUIRED — date you confirmed pricing, YYYY-MM-DD

endpoints:
  - id: example-provider.do-thing   # REQUIRED — <provider>.<action>, lowercase-hyphenated
    method: GET                     # REQUIRED
    path: /v1/do-thing              # REQUIRED — relative to a base_url below
    summary: "One sentence: what calling this actually gets you."
    params:
      - name: query
        in: query                   # query | body | path
        type: string
        required: true
        example: "hello world"
    note: ""                        # anything non-obvious about this specific endpoint

base_url: https://api.example.com
